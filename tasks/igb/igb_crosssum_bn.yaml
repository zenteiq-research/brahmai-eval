task: igb_crosssum_bn
dataset_path: json
dataset_kwargs:
  data_files:
    test: __DATA_DIR__/igb/crosssum_bn/test.json
    dev: __DATA_DIR__/igb/crosssum_bn/dev.json
  field: examples
test_split: test
fewshot_split: dev
output_type: generate_until
doc_to_text: "Article: {{text}}\n\nWrite a one-sentence summary of the article above in Bengali.\n\nSummary:"
doc_to_target: "{{summary}}"
process_results: !function utils.process_results_chrf
target_delimiter: ' '
generation_kwargs:
  until:
    - "\n"
  do_sample: false
  temperature: 0.0
metric_list:
  - metric: chrf
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
