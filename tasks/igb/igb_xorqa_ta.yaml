task: igb_xorqa_ta
dataset_path: json
dataset_kwargs:
  data_files:
    test: __DATA_DIR__/igb/xorqa_ta/test.json
    dev: __DATA_DIR__/igb/xorqa_ta/dev.json
  field: examples
test_split: test
fewshot_split: dev
output_type: generate_until
doc_to_text: "Passage: {{context}}\n\nQuestion: {{question}}\n\nAnswer:"
doc_to_target: '{{ translated_answers[0]["text"] if translated_answers and translated_answers[0]["text"] else answers[0]["text"] }}'
process_results: !function utils.process_results_xorqa
target_delimiter: ' '
generation_kwargs:
  until:
    - "\n"
  do_sample: false
  temperature: 0.0
metric_list:
  - metric: f1_inlang
    aggregation: mean
    higher_is_better: true
  - metric: em_inlang
    aggregation: mean
    higher_is_better: true
  - metric: f1_en
    aggregation: mean
    higher_is_better: true
  - metric: em_en
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
