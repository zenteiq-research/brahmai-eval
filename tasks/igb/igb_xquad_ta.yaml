task: igb_xquad_ta
dataset_path: json
dataset_kwargs:
  data_files:
    test: __DATA_DIR__/igb/xquad_ta/test.json
    dev: __DATA_DIR__/igb/xquad_ta/dev.json
  field: examples
test_split: test
fewshot_split: dev
output_type: generate_until
doc_to_text: "Passage: {{context}}\n\nQuestion: {{question}}\n\nAnswer:"
doc_to_target: '{{answers[0]["text"]}}'
process_results: !function utils.process_results_qa
target_delimiter: ' '
generation_kwargs:
  until:
    - "\n"
  do_sample: false
  temperature: 0.0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
