# IndicCOPA gom: the test split minus 32 seeded held-out rows used as exemplars (no dev split exists).
# Source: ai4bharat/IndicCOPA @ d356ef19a4eb287e88a51d07a56b73ba88c7f188 (cc-by-4.0).
task: indiccopa_gom
custom_dataset: !function utils.indiccopa_dataset
dataset_kwargs:
  path: ai4bharat/IndicCOPA
  name: gom
  revision: d356ef19a4eb287e88a51d07a56b73ba88c7f188
  seed: "1234-indiccopa_gom_local"
test_split: test
fewshot_split: fewshot
output_type: multiple_choice
doc_to_text: !function utils.copa_doc_to_text
doc_to_choice: "{{[choice1, choice2]}}"
doc_to_target: label
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
