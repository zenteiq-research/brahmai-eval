[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brahmai-eval"
version = "1.0.0"
description = "Evaluate a Hugging Face checkpoint on open LLM benchmarks (English, code, maths, Indic, tool use) with vLLM, in one command."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "ZenteiQ AiTech Innovations Pvt. Ltd.", email = "research@zenteiq.ai"}]
keywords = ["evaluation", "benchmark", "LLM", "vLLM", "Indic", "tool use", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "vllm==0.25.1",
    "lm-eval[ifeval,math]==0.4.12",
    "huggingface_hub>=0.30",
    "datasets>=3.0",
    "pyyaml>=6",
    "sacrebleu>=2.4",
    "rouge-score>=0.1.2",
    "evaluate>=0.4",
    "nltk>=3.9",
    "langdetect>=1.0.9",
    "immutabledict>=4",
    "antlr4-python3-runtime==4.11",
    "pyarrow>=15",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
brahmai-eval = "brahmai_eval.cli:main"

[project.urls]
Homepage = "https://github.com/zenteiq-research/brahmai-eval"
Issues = "https://github.com/zenteiq-research/brahmai-eval/issues"

[tool.setuptools.packages.find]
include = ["brahmai_eval*"]

[tool.setuptools.package-data]
brahmai_eval = ["py.typed"]

[tool.ruff]
line-length = 175
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E701", "E702", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
